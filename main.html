            color: #cbd5e1;
            overflow-x: hidden;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            animation: marquee 30s linear infinite;
            display: flex;
            width: max-content;
        }

        .italic { font-style: italic; }

        .container-custom {
            width: 100%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        @media (min-width: 768px) {
            .container-custom {
                padding-left: 4rem;
                padding-right: 4rem;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(34, 197, 94, 0.3);

        }

        .switch-container {

            padding: 4px;
            border-radius: 999px;
            display: inline-flex;
            border: 1px solid rgba(255, 255, 255, 0.1);

        .switch-btn {
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .switch-btn.active {
            background: #22c55e;
            color: #000;
        }

        .lang-btn {
            font-size: 10px;
            font-weight: 900;
            opacity: 0.4;
            transition: opacity 0.3s;
            cursor: pointer;
        }
        .lang-btn.active {
            opacity: 1;
            color: #22c55e;

                                                <ul className="space-y-4">
                                                    {t.inclusoItems.map((it, i) => (
                                                        <li key={i} className="flex gap-4 items-start">
                                                            <i data-lucide="check" className="text-green-600 w-5 h-5"></i>
                                                            <div>
                                                                <div className="text-[11px] font-bold uppercase tracking-tight">{it}</div>
                                                                {i === 2 && <div className="text-[9px] text-slate-400 font-black uppercase">{t.inclusoItem3Sub}</div>}
                                                            </div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                            <div className="space-y-6">
                                                <div className="bg-black text-white p-10 rounded-[2.5rem] shadow-2xl">
                                                    <h3 className="text-2xl font-black uppercase italic mb-6 text-green-400">{t.avaliaCardTitle}</h3>
                                                    <div className="space-y-4">
                                                        <div className="flex justify-between border-b border-white/10 pb-2"><span className="text-[10px] font-black uppercase">{t.avaliaItem1}</span><span className="font-black">{t.avaliaItem1Price}</span></div>
                                                        <div className="flex justify-between border-b border-white/10 pb-2"><span className="text-[10px] font-black uppercase">{t.avaliaItem2}</span><span className="font-black">{t.avaliaItem2Price}</span></div>
                                                        <div className="p-4 bg-green-500/10 border border-green-500/30 rounded-xl mt-4"><p className="text-xs font-black uppercase text-green-400 leading-tight">{t.avaliaOffer}</p></div>
                                                    </div>
                                                </div>
                                                <div className="bg-slate-100 p-8 rounded-[2rem] border border-black/5 flex gap-4 items-center">
                                                    <i data-lucide="car" className="text-black w-6 h-6"></i>
                                                    <div className="text-[10px] font-bold text-slate-500 uppercase leading-snug">
                                                        <span className="block text-black font-black mb-1">{t.travelTitle}</span>
                                                        {t.travelDesc}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <h3 className="text-center text-3xl font-black uppercase italic mb-10">{t.pricesTitle}</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                            {[t.priceSingleVal, t.pricePack4Val, t.pricePack8Val, t.pricePack12Val].map((val, i) => (
                                                <div key={i} className={`p-8 rounded-3xl flex flex-col ${i === 2 ? 'bg-green-50 border-2 border-green-500 shadow-xl' : 'bg-slate-50 border border-black/5'} ${i === 3 ? 'bg-black text-white' : ''}`}>
                                                    <h4 className={`text-[10px] font-black uppercase mb-2 ${i === 3 ? 'text-slate-400' : 'text-slate-400'}`}>{t.priceNames[i]}</h4>
                                                    <div className={`text-3xl font-black mb-2 ${i === 3 ? 'text-green-400' : ''}`}>{val}</div>
                                                    {i > 0 && <div className="text-[9px] font-bold text-slate-500 uppercase mb-6">{t.pricePerAula.replace('{val}', [0, 120, 110, 100][i])}</div>}
                                                    <button onClick={() => handleWhatsApp(t.priceNames[i])} className={`mt-auto w-full py-3 rounded-xl font-black uppercase text-[10px] transition-all border-2 ${i === 3 ? 'bg-green-500 border-green-500 text-black' : 'border-black hover:bg-black hover:text-white'}`}>{lang === 'pt' ? 'Selecionar' : 'Select'}</button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="mt-12 p-8 border-l-4 border-green-500 bg-slate-50 italic font-black uppercase text-xs text-black">
                                            {t.location} <br/> <span className="text-slate-500 text-[10px]">{t.gymFeeNote}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section className="py-24 bg-[#05080f]">
                        <div className="max-w-3xl mx-auto px-8 text-center md:text-left">
                            <h2 className="text-3xl md:text-5xl font-black text-white uppercase italic mb-16 leading-none tracking-tighter text-center">{t.faqTitle}</h2>
                            <div className="bg-white/5 p-6 md:p-10 rounded-[2.5rem] border border-white/5">
                                {t.faqs.map((f, i) => <FAQItem key={i} question={f.q} answer={f.a} />)}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-20 border-t border-white/5 text-center bg-[#05080f]">
                        <div className="container-custom">
                            <div className="flex justify-center items-center gap-4 mb-8">
                                <i data-lucide="activity" className="text-green-400 w-6 h-6"></i>
                                <div className="text-2xl font-black text-white italic uppercase tracking-tighter">GARIBALDI</div>
                                <div className="h-6 w-px bg-white/10"></div>
                                <div className="text-[10px] font-black uppercase text-slate-500">CREF 035143</div>
                            </div>
                            <div className="flex justify-center gap-8 mb-10 font-black uppercase text-[10px] text-slate-400 italic">
                                <button onClick={() => handleWhatsApp()} className="hover:text-green-400">WhatsApp</button>
                                <span className="opacity-10">•</span>
                                <a href="mailto:contato@nicolasgaribaldi.com" className="hover:text-green-400">Email</a>
                            </div>
                            <p className="text-slate-700 text-[9px] font-black uppercase tracking-[0.4em]">{t.footer} • © 2024</p>
                        </div>
                    </footer>

                    {/* Mobile CTA */}
                    <div className="fixed bottom-6 left-0 w-full px-6 z-50 md:hidden">
                        <button onClick={() => handleWhatsApp()} className="w-full bg-green-500 text-black py-4 rounded-2xl font-black text-base shadow-2xl flex items-center justify-center gap-3 uppercase italic">
                             <i data-lucide="message-circle" className="w-5 h-5"></i> {t.mobileCTA}
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
